# DIST-5: a `v*` tag builds the desktop app for Linux, macOS (Apple silicon
# and Intel) and Windows, signs each bundle for the updater, and publishes
# them — with latest.json, which installed apps read — on that tag's release.
#
# Cutting a release: bump `version` in src-tauri/Cargo.toml (tauri.conf.json
# has none — it follows Cargo.toml), commit, `git tag vX.Y.Z`, push the tag.
# The tag must equal v<Cargo version>; the first job refuses otherwise.
#
# Secrets: TAURI_SIGNING_PRIVATE_KEY (the minisign private key from
# `cargo tauri signer generate`, its contents) and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD. The public key is in tauri.conf.json.
# Bundles are not OS-code-signed (DIST-1).
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    name: create the release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.result }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - id: version
        name: version from Cargo.toml, checked against the tag
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n1)"
          if [[ -z "$version" ]]; then
            echo "::error::no version in src-tauri/Cargo.toml"
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match src-tauri/Cargo.toml's version $version (expected v$version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # One release per tag, made once here so the four builds below never
      # race to create it; they upload into it by id.
      - id: release
        name: get or create the release
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            const tag = `v${process.env.VERSION}`;
            try {
              const { data } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
              core.info(`release ${tag} exists (${data.id})`);
              return data.id;
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            const { data } = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `menger-desktop ${tag}`,
              body: [
                `menger-desktop ${tag}.`,
                '',
                'Linux: the AppImage (or the .deb / .rpm). macOS: the .dmg for your Mac (aarch64 = Apple silicon, x64 = Intel). Windows: the -setup.exe or the .msi.',
                'Installed desktop builds offer this update themselves. The bundles are not OS-code-signed: Gatekeeper and SmartScreen ask before the first run.',
              ].join('\n'),
              draft: false,
              prerelease: false,
            });
            core.info(`created release ${tag} (${data.id})`);
            return data.id;

  build:
    name: build (${{ matrix.name }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux x86_64
            platform: ubuntu-22.04
            args: ""
          - name: macos aarch64
            platform: macos-latest
            args: --target aarch64-apple-darwin
          - name: macos x86_64
            platform: macos-latest
            args: --target x86_64-apple-darwin
          - name: windows x86_64
            platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux prerequisites
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: ${{ matrix.name }}

      # The app has no Node project; the CLI is the cargo one (cached in
      # ~/.cargo/bin by rust-cache after the first run).
      - name: tauri-cli
        shell: bash
        run: command -v cargo-tauri >/dev/null || cargo install tauri-cli --version "^2" --locked

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: cargo tauri
          args: ${{ matrix.args }}
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: v__VERSION__
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true

  check-updater-json:
    name: latest.json lists every platform
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      # The builds merge their platform into latest.json one after another;
      # this fails loudly if one was lost (re-run the failed build job).
      - name: check latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
        shell: bash
        run: |
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir .
          jq . latest.json
          test "$(jq -r .version latest.json)" = "$VERSION"
          for p in linux-x86_64 darwin-aarch64 darwin-x86_64 windows-x86_64; do
            jq -e --arg p "$p" '.platforms[$p].signature and .platforms[$p].url' latest.json >/dev/null \
              || { echo "::error::latest.json has no $p"; exit 1; }
          done
